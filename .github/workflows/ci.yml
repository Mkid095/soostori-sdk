name: CI

on:
  push:
    branches: [main]
    # The publish job gates on refs/tags/sdk-v*, but without this the
    # workflow never STARTS for a tag push, so publishing was unreachable:
    # a tag produced no run, and the job that would publish never evaluated.
    tags: ['sdk-v*']
  pull_request:
    branches: [main]

# Supersede in-progress runs for the same ref so rapid pushes do not leave
# several stale builds competing for runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Verdaccio is the self-hosted registry for all @soostori/* packages.
  VERDACCIO_URL: https://registry.nextmavens.com/

jobs:
  # ── Build & type-check every package against workspace source ─────────────
  build:
    name: Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm run build

  # ── Publish every package to Verdaccio on a release tag ──────────────────
  # Internal deps use `workspace:*`, so each package is built against its
  # siblings. pnpm rewrites `workspace:*` to the concrete version at publish
  # time, which is what consumers resolve from Verdaccio.
  publish:
    name: Publish to Verdaccio
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Write Verdaccio .npmrc
        run: |
          echo "@soostori:registry=${{ env.VERDACCIO_URL }}" > .npmrc
          echo "//registry.nextmavens.com/:_authToken=${{ secrets.VERDACCIO_AUTH_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Publish all packages to Verdaccio
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_AUTH_TOKEN }}
          NPM_CONFIG_REGISTRY: ${{ env.VERDACCIO_URL }}
        run: |
          pnpm -r publish \
            --no-git-checks \
            --registry "$NPM_CONFIG_REGISTRY" \
            --access public