name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  typecheck:
    name: Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm run build

  publish-verdaccio:
    name: Publish to Verdaccio (on changes)
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Configure Verdaccio registry
        run: |
          echo "@soostori:registry=${{ secrets.VERDACCIO_REGISTRY }}" >> .npmrc
          echo "//${{ secrets.VERDACCIO_REGISTRY_HOST }}/:_authToken=${{ secrets.VERDACCIO_AUTH_TOKEN }}" >> .npmrc
          cat .npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Detect changed packages
        id: changed
        run: |
          # Get list of packages whose source changed since last commit
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E "^packages/[^/]+/src/" | cut -d/ -f2 | sort -u)
          if [ -z "$CHANGED" ]; then
            CHANGED=$(ls -d packages/*/ packages/business/*/ 2>/dev/null | grep -v __ | xargs -n1 basename | sort -u)
          fi
          echo "changed_packages=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed packages: $CHANGED"

      - name: Bump patch versions for changed packages
        run: |
          for pkg in ${{ steps.changed.outputs.changed_packages }}; do
            PKG_JSON="packages/$pkg/package.json"
            if [ ! -f "$PKG_JSON" ]; then
              PKG_JSON="packages/business/$pkg/package.json"
            fi
            if [ -f "$PKG_JSON" ]; then
              node -e "
                const fs = require('fs');
                const p = JSON.parse(fs.readFileSync('$PKG_JSON', 'utf8'));
                const v = p.version.split('.').map(Number);
                v[2] = (v[2] || 0) + 1;
                p.version = v.join('.');
                fs.writeFileSync('$PKG_JSON', JSON.stringify(p, null, 2) + '\n');
                console.log('Bumped $pkg to ' + p.version);
              "
            fi
          done

      - name: Build all packages
        run: pnpm run build

      - name: Publish to Verdaccio
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_AUTH_TOKEN }}
        run: |
          pnpm -r --filter "./packages/**" publish --no-git-checks --registry=${{ secrets.VERDACCIO_REGISTRY }} --access=public || true
