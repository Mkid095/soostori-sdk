# Publish SDK to npm via OIDC trusted publishing
#
# Why this exists:
#   The CLI token `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` is a 2FA-bypass
#   Granular Access Token (GAT). Per the npm v12 announcement (July 8, 2026),
#   2FA-bypass tokens cannot publish directly — they can only stage. This
#   workflow uses OIDC trusted publishing instead: the workflow identity
#   (signed by GitHub) is what npm authorizes, no long-lived token needed.
#
# How to trigger:
#   1. Bump version: edit packages/*/package.json, commit
#   2. Tag:   git tag v0.2.0 && git push --tags
#   3. Or:    Actions tab → "Publish SDK to npm" → Run workflow
#
# One-time npm-side setup (do this BEFORE first publish):
#   For each of the 7 critical packages, in the npm web UI:
#     https://www.npmjs.com/package/<name> → Settings → Trusted Publishers → Add
#     - Provider: GitHub Actions
#     - Repository: Mkid095/soostori-sdk
#     - Workflow file: .github/workflows/publish.yml
#     - Environment name: (leave blank)
#
# This binds npm to trust this specific workflow for this specific package.

name: Publish SDK to npm

on:
  push:
    tags:
      - 'v*.*.*'                    # e.g., v0.2.0, v0.2.1, v1.0.0
  workflow_dispatch:               # manual trigger from Actions tab

permissions:
  id-token: write                  # required for OIDC trusted publishing
  contents: read

jobs:
  publish-critical:
    name: Publish 7 critical packages to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js with OIDC registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        # Don't use --frozen-lockfile here: the publish workflow mutates
        # the 7 critical package.json files (version bump, internal deps)
        # and the lockfile needs to resolve fresh.
        run: pnpm install

      - name: Bump to release version and set publishable internal deps
        env:
          # Use the tag (without 'v' prefix) or default to 0.2.0
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.2.0' }}
        run: |
          set -e
          VER="${RELEASE_VERSION#v}"
          echo "Setting 7 critical packages to ${VER}"
          for pkg in core contracts subscription events sync auth schema; do
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('packages/${pkg}/package.json', 'utf8'));
              p.version = '${VER}';
              for (const k of Object.keys(p.dependencies || {})) {
                if (k.startsWith('@soostori/')) p.dependencies[k] = '^${VER}';
              }
              for (const k of Object.keys(p.devDependencies || {})) {
                if (k.startsWith('@soostori/')) p.devDependencies[k] = '^${VER}';
              }
              for (const k of Object.keys(p.peerDependencies || {})) {
                if (k.startsWith('@soostori/')) p.peerDependencies[k] = '^${VER}';
              }
              fs.writeFileSync('packages/${pkg}/package.json', JSON.stringify(p, null, 2) + '\n');
              console.log('  ' + '${pkg}' + ': version=' + '${VER}' + ', internal deps=^${VER}');
            "
          done

      - name: Build core first (the foundation everything else depends on)
        # core must be built before any of its consumers (auth, contracts,
        # subscription, events, sync, schema) so its `dist/` and `.d.ts` files
        # exist for type resolution. pnpm -r's topological walk doesn't
        # always serialize this for packages with workspace:* deps in
        # parallel mode.
        run: pnpm -r --filter '@soostori/core' build

      - name: Build ALL remaining packages
        # Now that core's dist/ exists, build the rest of the workspace so
        # all cross-package type references resolve.
        run: pnpm -r --filter './packages/**' --filter '!@soostori/core' build

      - name: Publish in dependency order
        # The NODE_AUTH_TOKEN env var is auto-set by actions/setup-node when
        # registry-url is provided. npm publish uses it implicitly.
        run: |
          for pkg in core contracts subscription events sync auth schema; do
            echo ""
            echo "Publishing @soostori/${pkg}..."
            (cd "packages/$pkg" && npm publish --access public --provenance=false) || {
              echo "::error::Failed to publish @soostori/${pkg}"
              exit 1
            }
          done

      - name: Verify published versions
        run: |
          echo ""
          echo "=== Verifying published versions ==="
          for pkg in core contracts subscription events sync auth schema; do
            ver=$(npm view "@soostori/${pkg}" version 2>/dev/null || echo "NOT FOUND")
            echo "  @soostori/${pkg}@${ver}"
          done

      - name: Restore workspace:* in package.json (for local monorepo dev)
        if: always()
        run: |
          for pkg in core contracts subscription events sync auth schema; do
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('packages/${pkg}/package.json', 'utf8'));
              for (const k of Object.keys(p.dependencies || {})) {
                if (k.startsWith('@soostori/')) p.dependencies[k] = 'workspace:*';
              }
              for (const k of Object.keys(p.devDependencies || {})) {
                if (k.startsWith('@soostori/')) p.devDependencies[k] = 'workspace:*';
              }
              for (const k of Object.keys(p.peerDependencies || {})) {
                if (k.startsWith('@soostori/')) p.peerDependencies[k] = 'workspace:*';
              }
              fs.writeFileSync('packages/${pkg}/package.json', JSON.stringify(p, null, 2) + '\n');
            "
          done
          echo "workspace:* restored in SDK package.json files."
